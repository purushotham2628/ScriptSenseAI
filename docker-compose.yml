version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ancient:ancient@postgres:5432/ancient_ai
      MONGODB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - mongo
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A backend.workers.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://ancient:ancient@postgres:5432/ancient_ai
      MONGODB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - mongo
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ancient_ai
      POSTGRES_USER: ancient
      POSTGRES_PASSWORD: ancient
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  mongo-data:
