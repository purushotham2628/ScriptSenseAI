name: backend-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic numpy Pillow opencv-python-headless torch SQLAlchemy python-jose passlib
      - name: Syntax check backend
        run: python -m compileall backend
      - name: Build Docker image
        run: docker build -t ancient-ai-api:ci .
